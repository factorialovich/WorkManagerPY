name: Build LockClockFix v1.4
on:
  push:
    branches: [ main ]
    paths:
      - 'tmp-lockclockfix-v1.4/**'
      - '.github/workflows/build-lockclockfix-v1.4.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: tmp-lockclockfix-v1.4
        run: gradle assembleDebug --stacktrace
      - name: Copy
        run: cp tmp-lockclockfix-v1.4/app/build/outputs/apk/debug/app-debug.apk LockClockFix-v1.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LockClockFix-v1.4
          path: LockClockFix-v1.4.apk
